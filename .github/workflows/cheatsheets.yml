name: Cheat sheets

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.13.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - run: make cheatsheets-check
      - run: make cheatsheets
      - name: Verify PDFs
        run: |
          test "$(find dist -maxdepth 1 -name '*.pdf' -size +0c | wc -l)" -eq 3
          for pdf in dist/*.pdf; do pdfinfo "$pdf" | grep -q 'Page size:.*595.*842.*pts'; done
      - uses: actions/upload-artifact@v4
        with:
          name: cheat-sheet-pdfs
          path: dist/*.pdf
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cheat-sheet-pdfs
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pdf
